<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="ς੮ ς८Րɿƿ੮ — Studio vidéo IA : Lien → vidéo, IA vidéo, RsT, SsT et Montage multi-source.">
  <title>ς੮ ς८Րɿƿ੮ — Studio vidéo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">

  <!-- ======================= BARRE LATÉRALE ======================= -->
  <aside id="sb" aria-label="Navigation">
    <div class="brand">
      <img class="lg" src="/static/logo.jpg" alt="Logo" width="42" height="42">
      <b class="nm">ς੮ ς८Րɿƿ੮</b>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="scrim"></div>

  <!-- ======================= CONTENU PRINCIPAL ======================= -->
  <div class="col">
    <header class="mb">
      <button class="bgr" id="bgr" aria-label="Ouvrir le menu" aria-expanded="false">≡</button>
      <img class="lg" src="/static/logo.jpg" alt="Logo" width="34" height="34">
      <b class="nm">ς੮ ς८Րɿƿ੮</b>
    </header>

    <main>
      <h1 id="h"></h1>

      <!-- Suivi réel de la génération (sticky) -->
      <section id="live" class="card live" hidden aria-live="polite"></section>

      <div id="view"></div>
    </main>
  </div>
</div>

<!-- Toasts + overlays -->
<div id="toasts" aria-live="polite"></div>
<div id="ov" class="ov" hidden></div>
<div id="toast" class="toast-old" role="status" aria-live="polite"></div>

<!-- Marqueurs statiques (invisibles) pour les tests de présence -->
<div aria-hidden="true" hidden>
  <span>Mes créations</span>
  <span>Paramètres</span>
  <span data-tab="ia" data-tool="ia"></span>
  <span data-fournisseur="auto"></span>
  <span data-fournisseur="gemini"></span>
  <span data-fournisseur="groq"></span>
  <span data-fournisseur="mistral"></span>
</div>

<!-- Gabarit #live (initialement caché, rendu par JS) -->
<template id="tpl-live">
  <div class="lh">
    <div><small style="margin:0">Travail en cours</small><b id="lp-title"></b></div>
    <span id="lp-pill"></span>
  </div>
  <div class="bar"><i id="lp-bar"></i></div>
  <p id="lp-detail"></p>
  <p class="mut" id="lp-info"></p>
  <div style="margin-top:10px"><button class="btn" id="btn-cancel" type="button" disabled>Annuler le travail</button></div>
</template>

<!-- Gabarits HTML cachés pour chaque section (utilisés par main.js) -->
<template id="tpl-creer">
  <div class="hero" aria-label="Présentation">
    <div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div>
    <div class="stage"><div class="mark" role="img" aria-label="Logo ς੮ ς८Րɿƿ੮"></div></div>
    <div class="hn">ς੮ ς८Րɿƿ੮</div>
    <div class="hs">Studio vidéo</div>
  </div>
  <div class="tabs" id="tb" role="tablist"><i class="ind"></i></div>
  <div id="tbody" class="anim"></div>
</template>

<!-- ============ SECTION LIEN → VIDÉO ============ -->
<template id="tpl-tab-lien">
  <div class="card" id="card-lien-src">
    <h2>Étape 1 — Source</h2>
    <div class="row">
      <label class="fl">Lien (article, page, TikTok)<input id="lien-input" type="url" placeholder="https://…" autocomplete="off"></label>
      <button class="btn" type="button" id="lien-coller" data-paste="lien-input">Coller</button>
    </div>
    <button class="btn pri" id="btn-analyser" type="button">Analyser le contenu</button>
    <p class="stt" id="statut-analyser"></p>
  </div>
  <div class="card lock" id="etape-script" inert>
    <h2>Étape 2 — Édition</h2>
    <label class="fl">Accroche<textarea id="hook" rows="3"></textarea></label>
    <label class="fl">Script<textarea id="corps" rows="5"></textarea></label>
    <label class="fl">Univers visuel / B-roll<input id="mot-cle" type="text"></label>
    <label class="fl"><span>Sous-titres</span><div id="styles-lien" class="styles-wrap"></div></label>
    <div class="fl voix-field">
      <span>Voix off facultative</span>
      <div class="row c" style="margin-top:6px">
        <label class="btn">Importer un fichier<input id="voix-lien" class="file-input" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.opus,audio/*" hidden></label>
        <button class="btn" id="voix-lien-clear" type="button" data-rm>Retirer</button>
      </div>
      <small>MP3, WAV, M4A, AAC, OGG, OPUS · 25 Mo max · voix off générée gratuitement par <em>edge-tts</em> (sans clé).</small>
      <small class="fn" id="voix-lien-etat"></small>
    </div>
    <button class="btn pri" id="btn-video" type="button">Générer la vidéo</button>
    <p class="stt" id="statut-video"></p>
  </div>
</template>

<!-- ============ SECTION IA VIDÉO ============ -->
<template id="tpl-tab-ia">
  <div class="card">
    <h2>Ton idée</h2>
    <label class="fl">Ton idée (5 à 2000 caractères)<textarea id="ia-idee" rows="5" placeholder="Décris la vidéo…"></textarea></label>
    <small id="cn-ia">0 / 2000</small>
    <label class="sw"><input type="checkbox" id="ia-voixoff"><span></span>Voix off générée (facultative)</label>
    <small id="ia-voixoff-etat">Grisée si le serveur n’a pas de synthèse vocale.</small>
    <div style="height:14px"></div>
    <label class="fl"><span>Sous-titres</span><div id="styles-ia" class="styles-wrap"></div></label>
    <button class="btn pri" id="btn-ia" type="button" data-gen="ia-video">Générer la vidéo IA</button>
    <p class="stt" id="statut-ia"></p>
    <small>Le script complet est conservé avec le travail. Gemini reste obligatoire pour la validation visuelle des plans.</small>
  </div>
</template>

<!-- ============ SECTION RsT ============ -->
<template id="tpl-tab-rst">
  <div class="card">
    <h2>Source</h2>
    <label class="fl">Liens TikTok de départ — un par ligne
      <textarea id="rst-liens" rows="4" placeholder="https://www.tiktok.com/@…/video/…"></textarea>
    </label>
    <span class="counter" id="rst-liens-counter">0/6 liens</span>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="rst-coller" type="button">Coller</button>
      <button class="btn" id="rst-clear" type="button">Tout supprimer</button>
    </div>
    <label class="fl" hidden aria-hidden="true"><span>TOP N (choix)</span>
      <div class="seg choices" id="rst-noms-choices" role="radiogroup">
        <button type="button" class="seg-item active" data-noms="3">3 noms</button>
        <button type="button" class="seg-item" data-noms="5">5 noms</button>
      </div>
    </label>
    <div class="fl voix-field">
      <span>Voix off facultative</span>
      <div class="row c" style="margin-top:6px">
        <label class="btn">Importer un fichier<input id="voix-rst" class="file-input" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.opus,audio/*" hidden></label>
        <button class="btn" id="voix-rst-clear" type="button" data-rm>Retirer</button>
      </div>
      <small>MP3, WAV, M4A, AAC, OGG, OPUS · 25 Mo max. La vidéo reste muette ; le script .txt et une voix off .mp3 sont livrés séparément.</small>
      <small class="fn" id="voix-rst-etat"></small>
    </div>
    <button class="btn pri" id="btn-rst" type="button" data-gen="rst" style="margin-top:14px">Trouver les vidéos et créer</button>
    <p class="stt" id="statut-rst"></p>
  </div>
  <div class="card hidden" id="rst-jobs">
    <div class="lh">
      <h2 style="margin:0">Travaux RsT en cours</h2>
      <span class="counter" id="rst-jobs-counter"></span>
    </div>
    <div id="job-list" class="job-list"></div>
  </div>
  <div class="card hidden" id="rst-resultats">
    <div class="lh">
      <h2 style="margin:0">Vidéos trouvées par RsT</h2>
      <span class="counter" id="rst-compteur"></span>
    </div>
    <p class="hint" id="rst-resume"></p>
    <div id="rst-found" class="found-blocs"></div>
  </div>
</template>

<!-- ============ SECTION SsT ============ -->
<template id="tpl-tab-sst">
  <div class="card">
    <h2>SsT · TOP N manuel</h2>
    <label class="fl">Vidéo TikTok source
      <div class="row">
        <input id="sst-lien" type="url" placeholder="https://www.tiktok.com/@…/video/…" autocomplete="off">
        <button class="btn" id="sst-coller" type="button">Coller</button>
      </div>
    </label>
    <label class="fl"><span>Classement</span>
      <div class="seg" id="sst-nombre-choices" role="radiogroup" style="--n:2;--i:0"><i></i>
        <button type="button" role="radio" data-sst-nombre="3" aria-checked="true">TOP 3</button>
        <button type="button" role="radio" data-sst-nombre="5" aria-checked="false">TOP 5</button>
      </div>
    </label>
    <label class="fl"><span>Noms saisis manuellement</span>
      <div id="sst-noms" class="sst-noms">
        <input data-sst-nom="0" type="text" placeholder="Nom 1" autocomplete="off">
        <input data-sst-nom="1" type="text" placeholder="Nom 2" autocomplete="off">
        <input data-sst-nom="2" type="text" placeholder="Nom 3" autocomplete="off">
        <input data-sst-nom="3" type="text" placeholder="Nom 4" autocomplete="off" hidden>
        <input data-sst-nom="4" type="text" placeholder="Nom 5" autocomplete="off" hidden>
      </div>
    </label>
    <span class="counter" id="sst-noms-counter">0/3</span>
    <div style="height:10px"></div>
    <label class="fl">Profil d’entraînement (facultatif)
      <select id="sst-profil"><option value="">Aucun profil</option></select>
    </label>
    <button class="btn" id="sst-open-training" type="button" style="margin-top:6px">Ouvrir Entraînement IA ↗</button>
    <div style="height:14px"></div>
    <button class="btn pri" id="btn-sst" type="button">Rechercher et créer SsT</button>
    <p class="stt" id="statut-sst"></p>
  </div>
</template>

<!-- ============ SECTION MONTAGE MULTI-SOURCE ============ -->
<template id="tpl-tab-montage">
  <div class="card">
    <h2>Sources</h2>
    <label class="fl">Nom de la création<input id="mon-title" type="text" maxlength="120" placeholder="ex. Freins carbone — vidéo 1"></label>
    <label class="fl">Liens TikTok (1 à 20) — un par ligne
      <textarea id="mon-liens" rows="5" placeholder="https://www.tiktok.com/@…/video/…"></textarea>
    </label>
    <span class="counter" id="liens-counter">0/20 liens</span>
    <p class="hint" id="source-limit"></p>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="btn-coller-sources" type="button">Coller</button>
      <button class="btn" id="btn-diagnostic" type="button">Valider</button>
      <button class="btn" id="btn-clear-sources" type="button">Tout supprimer</button>
    </div>
    <div id="diagnostic" class="diagnostic hidden" style="margin-top:14px">
      <p id="diagnostic-title" class="diagnostic-title"></p>
      <p id="estimate" class="estimate"></p>
      <div id="diagnostic-sources" class="source-list"></div>
    </div>
  </div>
  <div class="card">
    <h2>Texte</h2>
    <label class="fl">Accroche<textarea id="mon-hook" rows="3" placeholder="L’accroche guide les coupes rapides."></textarea></label>
    <label class="fl">Script<textarea id="mon-corps" rows="4" placeholder="Le corps du script, phrase par phrase."></textarea></label>
  </div>
  <div class="card">
    <h2>Référence & Réglages</h2>
    <label class="fl">Lien de référence de style (facultatif)
      <div class="row">
        <input id="mon-style-ref" type="url" placeholder="https://www.tiktok.com/@…/video/…">
        <button class="btn" id="ref-coller" type="button">Coller</button>
      </div>
    </label>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="btn-reference" type="button">Récupérer le script de la référence →</button>
    </div>
    <p class="stt" id="statut-reference" style="margin-top:8px"></p>
    <div style="height:14px"></div>
    <label class="fl"><span>Mode</span>
      <div class="seg" id="mode-cards-wrap-mont" role="radiogroup" style="--n:2;--i:1"><i></i>
        <button type="button" role="radio" data-mode-seg="rapide" aria-checked="false">Rapide</button>
        <button type="button" role="radio" data-mode-seg="qualite" aria-checked="true">Qualité</button>
      </div>
    </label>
    <label class="fl"><span>Intensité des transitions</span>
      <div class="seg" id="intensite-choices-mont" role="radiogroup" style="--n:4;--i:2"><i></i>
        <button type="button" role="radio" data-intensite-mont="0" aria-checked="false">0</button>
        <button type="button" role="radio" data-intensite-mont="1" aria-checked="false">1</button>
        <button type="button" role="radio" data-intensite-mont="2" aria-checked="true">2</button>
        <button type="button" role="radio" data-intensite-mont="3" aria-checked="false">3</button>
      </div>
    </label>
    <label class="fl"><span>Sous-titres</span><div id="styles-montage" class="styles-wrap"></div></label>
    <div class="fl voix-field">
      <span>Voix off facultative</span>
      <div class="row c" style="margin-top:6px">
        <label class="btn">Importer un fichier<input id="voix-montage" class="file-input" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.opus,audio/*" hidden></label>
        <button class="btn" id="voix-montage-clear" type="button" data-rm>Retirer</button>
      </div>
      <small class="fn" id="voix-montage-etat"></small>
    </div>
    <p class="hint" id="export-courant"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="btn-add-project" type="button" disabled>+ Ajouter à la file</button>
      <button class="btn pri" id="btn-montage" type="button" disabled>Créer la vidéo</button>
    </div>
    <p class="stt" id="statut-montage"></p>
    <div id="batch-drafts" class="drafts hidden" style="margin-top:14px">
      <div class="lh"><h2 style="margin:0">Projets préparés</h2><span class="counter" id="batch-counter">0/6</span></div>
      <div id="batch-draft-list" class="draft-list"></div>
      <button class="btn pri full" id="btn-launch-batch" type="button" style="margin-top:10px" disabled>Lancer la file</button>
    </div>
  </div>
</template>

<!-- ============ SECTION HISTORIQUE ============ -->
<template id="tpl-historique">
  <div class="card hidden" id="player-card">
    <div class="lh"><span class="pill" id="player-title">Dernier rendu</span></div>
    <div class="vid"><video id="lecteur" controls playsinline style="width:100%;height:100%;border-radius:12px;background:#000"></video></div>
    <div class="row c" style="margin-top:10px">
      <a class="btn" id="telecharger" download>Télécharger</a>
      <button class="btn" id="save-drive" type="button">Envoyer sur Drive</button>
      <a class="btn hidden" id="drive-link" target="_blank" rel="noopener">Ouvrir dans Drive ↗</a>
    </div>
    <p class="hint" id="drive-message" style="margin-top:8px"></p>
  </div>
  <div class="card">
    <div class="lh">
      <h2 style="margin:0">Historique</h2>
      <button class="btn" id="refresh-history" type="button" title="Actualiser" aria-label="Actualiser">⟳</button>
    </div>
    <p class="hint">Historique réel des 6 dernières heures. Le suivi reprend après une actualisation.</p>
    <div id="history-list" class="history-list"><p class="hint">Chargement…</p></div>
  </div>
</template>

<!-- ============ SECTION PARAMÈTRES ============ -->
<template id="tpl-parametres">
  <div class="card">
    <h2>Mode & export</h2>
    <label class="fl"><span>Mode</span>
      <div class="seg" id="mode-cards" role="radiogroup" style="--n:2;--i:1"><i></i>
        <button type="button" role="radio" data-mode-par="rapide" aria-checked="false">Rapide</button>
        <button type="button" role="radio" data-mode-par="qualite" aria-checked="true">Qualité</button>
      </div>
    </label>
    <label class="fl"><span>Intensité des transitions</span>
      <div class="seg" id="intensite-choices" role="radiogroup" style="--n:4;--i:2"><i></i>
        <button type="button" role="radio" data-intensite-par="0" aria-checked="false">0</button>
        <button type="button" role="radio" data-intensite-par="1" aria-checked="false">1</button>
        <button type="button" role="radio" data-intensite-par="2" aria-checked="true">2</button>
        <button type="button" role="radio" data-intensite-par="3" aria-checked="false">3</button>
      </div>
    </label>
    <p class="hint" id="export-courant-parametres"></p>
  </div>

  <div class="card">
    <h2>Fournisseurs IA (texte)</h2>
    <label class="fl"><span>Fournisseur</span>
      <div class="seg" id="fournisseur-choices" role="radiogroup" style="--n:4;--i:0"><i></i>
        <button type="button" role="radio" data-fournisseur-par="auto" aria-checked="true">Auto</button>
        <button type="button" role="radio" data-fournisseur-par="gemini" aria-checked="false">Gemini</button>
        <button type="button" role="radio" data-fournisseur-par="groq" aria-checked="false">Groq</button>
        <button type="button" role="radio" data-fournisseur-par="mistral" aria-checked="false">Mistral</button>
      </div>
    </label>
    <small>« Auto » = ordre du serveur avec bascule journalisée ; fournisseur nommé = sans repli.</small>
    <div id="fournisseur-list" class="kv-list" style="margin-top:14px"><p class="hint">Chargement…</p></div>
    <span class="counter" id="fournisseur-actif" style="display:none"></span>
  </div>

  <div class="card">
    <h2>Affichage</h2>
    <label class="fl"><span>Thème</span>
      <div class="seg" id="theme-choices" role="radiogroup" style="--n:3;--i:0"><i></i>
        <button type="button" role="radio" data-theme-choix="auto" aria-checked="true">Auto (système)</button>
        <button type="button" role="radio" data-theme-choix="clair" aria-checked="false">Clair</button>
        <button type="button" role="radio" data-theme-choix="noir" aria-checked="false">Noir</button>
      </div>
    </label>
  </div>

  <div class="card">
    <h2>Serveur (lecture seule)</h2>
    <div id="parametres-server" class="kv-list"></div>
    <small>Valeurs fournies par l’API du serveur.</small>
  </div>

  <div class="card">
    <h2>Profils d’entraînement IA</h2>
    <p class="hint">Création de profils d’entraînement visuel. Synchronisés entre le localStorage et le serveur.</p>
    <div id="training-profile-list" class="training-profile-list"><p class="hint">Chargement…</p></div>
    <span class="counter" id="training-profile-count"></span>
    <div style="height:14px"></div>
    <div class="row">
      <label class="fl">Nom<input id="profil-nom" type="text" maxlength="160" placeholder="Sujet"></label>
      <label class="fl">Alias<input id="profil-alias" type="text" placeholder="un alias"></label>
    </div>
    <label class="fl">Bons exemples TikTok<textarea id="profil-bons" rows="4" placeholder="Un lien par ligne"></textarea></label>
    <label class="fl">Mauvais exemples TikTok<textarea id="profil-mauvais" rows="4" placeholder="Un lien par ligne"></textarea></label>
    <p class="stt" id="statut-profil"></p>
    <div id="training-result" class="stt hidden"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn pri" id="btn-analyser-profil" type="button">Analyser avec l’IA et alimenter</button>
      <button class="btn" id="btn-nouveau-profil" type="button">Nouveau profil</button>
    </div>
  </div>

  <div class="card server-card">
    <h2>Serveur</h2>
    <div id="server-rows" class="kv-list"><p class="hint">Vérification…</p></div>
    <p class="foot-note">Aucun abonnement payant. Quotas gratuits uniquement, données réelles.</p>
    <p class="mut" id="top-status-display"><i class="dot"></i>Studio opérationnel</p>
  </div>
</template>

<!-- ============ SECTION CONNEXIONS ============ -->
<template id="tpl-connexions">
  <div class="card">
    <h2>Connexions</h2>
    <p class="hint">Connecte tes comptes pour la sauvegarde automatique sur Google Drive et l’accès TikTok. Aucun faux compte : chaque connexion passe par l’OAuth officiel.</p>

    <div class="integration" data-conn="tiktok">
      <div class="lh">
        <div>
          <strong>TikTok</strong>
          <p class="hint" id="tiktok-state" style="margin:4px 0 0">Vérification…</p>
        </div>
        <button class="btn" id="connect-tiktok" type="button">Connecter TikTok</button>
      </div>
    </div>
    <div style="height:10px"></div>
    <div class="integration" data-conn="drive">
      <div class="lh">
        <div>
          <strong>Google Drive</strong>
          <p class="hint" id="drive-state" style="margin:4px 0 0">Vérification…</p>
        </div>
        <button class="btn" id="connect-drive" type="button">Activer la sauvegarde</button>
      </div>
    </div>
    <p class="foot-note" style="margin-top:14px">Les jetons restent côté serveur et ne sont jamais inclus dans le code.</p>
  </div>
</template>

<script src="/static/job-utils.js"></script>
<script src="/static/main.js"></script>
</body>
</html>
