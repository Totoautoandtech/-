services:
  - type: web
    name: vesper-video-generator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/sante
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DUREE_CIBLE_SECONDES
        value: "30"
      # Garde-fous adaptés à Render Free (512 Mo). La limite globale vaut 9 min 30.
      - key: DUREE_MAX_SOURCE_SECONDES
        value: "180"
      - key: JOB_TIMEOUT_SECONDES
        value: "570"
      - key: FFMPEG_TIMEOUT_SECONDES
        value: "240"
      - key: GEMINI_TIMEOUT_SECONDES
        value: "120"
      - key: TIKWM_TIMEOUT_SECONDES
        value: "30"
      - key: DOWNLOAD_TIMEOUT_SECONDES
        value: "120"
      - key: GEMINI_ANALYSES_CONCURRENTES
        value: "1"
      - key: BUDGET_DISQUE_SOURCES_MO
        value: "700"
      - key: FFMPEG_PRESET
        value: ultrafast
      - key: FFMPEG_THREADS
        value: "1"
      - key: AUTORISER_EXPORT_1080
        value: "false"
      # Mode RsT : vidéos candidates recherchées puis sources retenues.
      - key: RST_CANDIDATS_MAX
        value: "40"
      - key: RST_SOURCES_MAX
        value: "20"
      - key: GMAIL_ADRESSE
        sync: false
      - key: GMAIL_MOT_DE_PASSE_APP
        sync: false
      - key: DESTINATAIRE_EMAIL
        value: tomheude8@gmail.com
      # OAuth TikTok Login Kit — ne jamais mettre les valeurs dans ce fichier.
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # OAuth Google (API Google Drive activée dans Google Cloud).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
