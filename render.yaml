services:
  - type: web
    name: vesper-video-generator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/sante
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      # Fournisseurs de TEXTE (scripts, extraction de noms, adaptations) : la
      # sélection se fait dans l'interface (auto = ordre ci-dessous, bascule
      # journalisée ; ou fournisseur nommé sans repli silencieux). Gemini reste
      # obligatoire pour l'audio, la vidéo et la validation visuelle des plans.
      # Les clés restent côté serveur, jamais dans Git ni dans le navigateur.
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: FOURNISSEURS_TEXTE_ORDRE
        value: gemini,groq,mistral
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Chaîne de modèles de secours essayée dans l'ordre. Quand Google répond 503
      # « This model is currently experiencing high demand » (ou 429), l'appel bascule
      # automatiquement sur le modèle suivant, puis sur la clé suivante.
      - key: GEMINI_MODELES
        value: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash
      - key: DUREE_CIBLE_SECONDES
        value: "30"
      # Garde-fous adaptés à Render Free (512 Mo). La limite globale vaut 30 min.
      - key: DUREE_MAX_SOURCE_SECONDES
        value: "180"
      - key: JOB_TIMEOUT_SECONDES
        value: "1800"
      - key: FFMPEG_TIMEOUT_SECONDES
        value: "240"
      - key: GEMINI_TIMEOUT_SECONDES
        value: "200"
      - key: TIKWM_TIMEOUT_SECONDES
        value: "30"
      - key: DOWNLOAD_TIMEOUT_SECONDES
        value: "120"
      - key: GEMINI_ANALYSES_CONCURRENTES
        value: "1"
      - key: BUDGET_DISQUE_SOURCES_MO
        value: "700"
      - key: FFMPEG_PRESET
        value: ultrafast
      - key: FFMPEG_THREADS
        value: "1"
      - key: AUTORISER_EXPORT_1080
        value: "false"
      # Mode RsT : vidéos candidates recherchées puis sources retenues.
      - key: RST_CANDIDATS_MAX
        value: "40"
      - key: RST_SOURCES_MAX
        value: "20"
      - key: GMAIL_ADRESSE
        sync: false
      - key: GMAIL_MOT_DE_PASSE_APP
        sync: false
      - key: DESTINATAIRE_EMAIL
        value: tomheude8@gmail.com
      # OAuth TikTok Login Kit — ne jamais mettre les valeurs dans ce fichier.
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # OAuth Google (API Google Drive activée dans Google Cloud).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
