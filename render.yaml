services:
  - type: web
    name: vesper-video-generator
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/sante
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DUREE_CIBLE_SECONDES
        value: "30"
      - key: GMAIL_ADRESSE
        sync: false
      - key: GMAIL_MOT_DE_PASSE_APP
        sync: false
      - key: DESTINATAIRE_EMAIL
        value: tomheude8@gmail.com
      # OAuth TikTok Login Kit — ne jamais mettre les valeurs dans ce fichier.
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # OAuth Google (API Google Drive activée dans Google Cloud).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
